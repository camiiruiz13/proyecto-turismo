LoginDTO:
  type: object
  properties:
    correo:
      type: string
      example: usuario@correo.com
    password:
      type: string
      example: "123456"
  required:
    - correo
    - password

SuccesResponseDTO:
  type: object
  properties:
    message:
      type: string
    data:
      type: object
      nullable: true

ErrorResponseDTO:
  type: object
  properties:
    error:
      type: string
    message:
      type: string

AuthResponseDTO:
  type: object
  properties:
    token:
      type: string
    expiresIn:
      type: integer

TipoDocumentoResponseDTO:
  type: object
  properties:
    id:
      type: integer
    codigo:
      type: string
    descripcion:
      type: string

PaisDTO:
  type: object
  properties:
    idPais:
      type: integer
      format: int64
    iso2:
      type: string
    iso3:
      type: string
    nombre:
      type: string
    prefijo:
      type: string

AtributeDTO:
  type: object
  properties:
    className:
      type: string
      example: Paises
    attributeName:
      type: string
      example: nombre
    attributeValue:
      type: string
      example: Spain
  required:
    - className
    - attributeName
    - attributeValue
